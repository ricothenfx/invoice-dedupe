[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-dedupe"
version = "0.1.0"
description = "Duplicate invoice detection (double-payment prevention) via canonical normalization, weighted fuzzy matching, blocking, and contextual rules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rico" }]
dependencies = [
    "rapidfuzz>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
invoice-dedupe = "invoice_dedupe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoice_dedupe = ["webapp/*.html", "webapp/*.css", "webapp/*.js", "webapp/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
