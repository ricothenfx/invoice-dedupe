[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-dedupe"
version = "0.1.0"
description = "Deteksi invoice duplikat (double payment) melalui normalisasi, fuzzy matching berbobot, blocking, dan aturan kontekstual"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rico" }]
dependencies = [
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
invoice-dedupe = "invoice_dedupe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
